<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickt S.A.C. - Catálogo de Productos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ... (Mismo CSS que ya tenías) ... */
        :root { --primary-orange: #f26522; --dark-black: #1a1a1a; --light-silver: #f4f4f5; --dark-silver: #a1a1aa; --white: #ffffff; }
        body { background-color: var(--light-silver); color: var(--dark-black); }
        header { background-color: var(--dark-black); color: var(--white); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--primary-orange); position: sticky; top: 0; z-index: 100; }
        .brand-title { font-size: 1.8rem; font-weight: 800; letter-spacing: 1px; }
        .brand-title span { color: var(--primary-orange); }
        .contact-info { display: flex; gap: 1.5rem; font-size: 0.95rem; }
        .contact-info a { color: var(--light-silver); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
        .search-container { margin-bottom: 2rem; display: flex; }
        .search-container input { flex: 1; padding: 1rem; border: 2px solid var(--dark-silver); border-radius: 8px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .product-card { background-color: var(--white); border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .product-image { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .product-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-details { padding: 1.5rem; }
        .btn-whatsapp { background-color: #25D366; color: white; text-align: center; padding: 0.75rem; border-radius: 6px; text-decoration: none; display: block; margin-top: 1rem; }
    </style>
</head>
<body>
    <header>
        <div class="brand-title"><span>QUICKT</span> S.A.C.</div>
        <div class="contact-info">
            <a href="https://wa.me/51970701782" target="_blank"><i class="fab fa-whatsapp"></i> 970 701 782</a>
        </div>
    </header>

    <div class="container">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar producto...">
        </div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <script>
        let allProducts = [];
        const grid = document.getElementById('productsGrid');

        fetch('productos.json')
            .then(response => response.json())
            .then(data => {
                allProducts = data;
                renderProducts(allProducts);
            });

        function renderProducts(products) {
            grid.innerHTML = '';
            products.forEach(p => {
                // Si FOTO está vacío, usa el placeholder
                const img = (p.FOTO && p.FOTO !== 'img/no-image.png') ? p.FOTO : 'https://via.placeholder.com/400x300?text=Sin+Imagen';
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${img}" onerror="this.src='https://via.placeholder.com/400x300?text=Sin+Imagen'">
                    </div>
                    <div class="product-details">
                        <h3>${p.MARCA}</h3>
                        <p>${p.DESCRIPCION}</p>
                        <p><strong>S/ ${p.PRECIO}</strong></p>
                        <a href="https://wa.me/51970701782?text=Hola, quiero info sobre ${p.SKU}" class="btn-whatsapp">Consultar</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
