<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Equipos - Quickt</title>
    <style>
        :root {
            --primary: #ff6600; 
            --black: #1a1a1a;
            --white: #ffffff;
            --silver: #e0e0e0;
            --bg: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--black);
        }
        header {
            background-color: var(--black);
            color: var(--white);
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 5px solid var(--primary);
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .card {
            background-color: var(--white);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--silver);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(255, 102, 0, 0.2);
        }
        .img-container {
            height: 220px;
            background-color: var(--white);
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--silver);
        }
        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .modelo {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .specs {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }
        .precio {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: auto;
            margin-bottom: 1rem;
        }
        .btn-ws {
            display: block;
            background-color: var(--primary);
            color: var(--white);
            text-align: center;
            padding: 0.8rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-ws:hover {
            background-color: #cc5200;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>Quickt</h1>
        <p>Catálogo Oficial de Laptops y Tecnología</p>
    </header>

    <div class="container" id="catalogo">
        <div class="loading">Cargando productos...</div>
    </div>

    <script>
        // Esta función lee el archivo JSON que generaremos a partir de tu Excel
        async function cargarProductos() {
            try {
                const respuesta = await fetch('productos.json');
                const productos = await respuesta.json();
                const contenedor = document.getElementById('catalogo');
                contenedor.innerHTML = ''; // Limpiar mensaje de carga

                productos.forEach(prod => {
                    // Número de WhatsApp configurado
                    const numeroWS = '51970701782';
                    const mensaje = encodeURIComponent(`Hola, estoy interesado en el modelo ${prod.modelo} que vi en el catálogo.`);
                    const enlaceWS = `https://wa.me/${numeroWS}?text=${mensaje}`;

                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'card';
                    tarjeta.innerHTML = `
                        <div class="img-container">
                            <img src="${prod.foto}" alt="${prod.modelo}">
                        </div>
                        <div class="info">
                            <div class="modelo">${prod.modelo}</div>
                            <div class="specs">${prod.descripcion || ''}</div>
                            <div class="precio">S/ ${prod.precio}</div>
                            <a href="${enlaceWS}" class="btn-ws" target="_blank">Comprar por WhatsApp</a>
                        </div>
                    `;
                    contenedor.appendChild(tarjeta);
                });
            } catch (error) {
                document.getElementById('catalogo').innerHTML = '<div class="loading">Error al cargar el catálogo. Verifica que productos.json exista.</div>';
                console.error('Error cargando el JSON:', error);
            }
        }

        // Ejecutar al iniciar
        cargarProductos();
    </script>
</body>
</html>
