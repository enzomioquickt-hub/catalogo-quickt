<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUICKT S.A.C. - Catálogo de Productos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #f26522; /* Quickt Orange */
            --dark-black: #1a1a1a;
            --light-silver: #f4f4f5;
            --dark-silver: #a1a1aa;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light-silver);
            color: var(--dark-black);
        }

        /* Header */
        header {
            background-color: var(--dark-black);
            color: var(--white);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary-orange);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-title span {
            color: var(--primary-orange);
        }

        /* Contacts */
        .contact-info {
            display: flex;
            gap: 1.5rem;
            font-size: 0.95rem;
        }

        .contact-info a {
            color: var(--light-silver);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: var(--primary-orange);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
        }

        .search-container input {
            flex: 1;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            border: 2px solid var(--dark-silver);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--primary-orange);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Product Card */
        .product-card {
            background-color: var(--white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #e4e4e7;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            border-color: var(--primary-orange);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            border-bottom: 1px solid var(--light-silver);
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-details {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-brand {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--dark-silver);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .product-sku {
            font-size: 0.85rem;
            color: var(--primary-orange);
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .product-title {
            font-size: 1rem;
            color: var(--dark-black);
            margin-bottom: 1rem;
            flex: 1;
            line-height: 1.4;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark-black);
            margin-bottom: 1.5rem;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: var(--white);
            text-align: center;
            padding: 0.75rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.3s ease;
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
        }

        /* Footer */
        footer {
            background-color: var(--dark-black);
            color: var(--dark-silver);
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            .contact-info {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title"><span>QUICKT</span> S.A.C.</div>
        <div class="contact-info">
            <a href="https://wa.me/51970701782" target="_blank"><i class="fab fa-whatsapp"></i> Asesor 1: 970 701 782</a>
            <a href="https://wa.me/51997752954" target="_blank"><i class="fab fa-whatsapp"></i> Asesor 2: 997 752 954</a>
        </div>
    </header>

    <div class="container">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar por modelo, marca, SKU o características...">
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Products will be injected here via JavaScript -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 QUICKT S.A.C. - Distribuidor Autorizado de Laptops. Todos los derechos reservados.</p>
        <p>Av. Inca Garcilazo de la Vega 1251, Int. 124. Galería Compu Plaza, Lima, Perú.</p>
    </footer>

    <script>
        // Array to store the fetched products
        let allProducts = [];
        const grid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('searchInput');

        // Fetch JSON data
        fetch('productos.json')
            .then(response => response.json())
            .then(data => {
                allProducts = data;
                renderProducts(allProducts);
            })
            .catch(error => {
                console.error('Error loading products:', error);
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:red;">Error cargando el catálogo. Asegúrese de subir productos.json en GitHub Pages.</p>';
            });

        // Search functionality
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredProducts = allProducts.filter(p => {
                const text = `${p.MARCA} ${p.SKU} ${p.DESCRIPCION}`.toLowerCase();
                return text.includes(searchTerm);
            });
            renderProducts(filteredProducts);
        });

        // Render products to DOM
        function renderProducts(products) {
            grid.innerHTML = '';
            
            if(products.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#a1a1aa; font-size:1.2rem;">No se encontraron productos.</p>';
                return;
            }

            products.forEach(product => {
                // Formatting price
                const priceNum = parseFloat(product.PRECIO);
                const priceFormatted = isNaN(priceNum) ? product.PRECIO : `S/ ${priceNum.toLocaleString('es-PE', {minimumFractionDigits: 2})}`;
                
                // --- MODIFICACIÓN: Asignación automática de imagen por SKU ---
                const imgSrc = `img/${product.SKU}.jpg`;

                const msg = encodeURIComponent(`Hola QUICKT S.A.C., estoy interesado en la laptop SKU: ${product.SKU} - ${product.MARCA}. ¿Tienen stock?`);
                const whatsappLink = `https://wa.me/51970701782?text=${msg}`;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${imgSrc}" alt="${product.SKU}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/f4f4f5/a1a1aa?text=Sin+Imagen'">
                    </div>
                    <div class="product-details">
                        <div class="product-brand">${product.MARCA || 'GENÉRICO'}</div>
                        <div class="product-sku">SKU: ${product.SKU}</div>
                        <div class="product-title">${product.DESCRIPCION}</div>
                        <div class="product-price">${priceFormatted}</div>
                        <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">
                            <i class="fab fa-whatsapp"></i> Consultar Stock
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
