<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Quickt</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .precio { color: #e65100; font-weight: bold; font-size: 1.2em; }
    .btn-ws { display: inline-block; background: #25D366; color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 5px; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>Catálogo de Productos</h1>
  <div id="contenedor-productos" class="grid"></div>

  <script>
    // Consume el archivo JSON alojado en la misma carpeta
    fetch('productos.json')
      .then(response => response.json())
      .then(data => {
        const contenedor = document.getElementById('contenedor-productos');
        data.productos.forEach(prod => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>${prod.nombre}</h3>
            <p><strong>Procesador:</strong> ${prod.especificaciones.procesador}</p>
            <p class="precio">S/ ${prod.precio_oferta.toFixed(2)}</p>
            <a href="${prod.whatsapp_link}" target="_blank" class="btn-ws">Consultar por WhatsApp</a>
          `;
          contenedor.appendChild(card);
        });
      })
      .catch(error => console.error('Error al cargar catálogo:', error));
  </script>

</body>
</html>
